<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise-1</title>
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    .wrapper {
      width: 600px;
      height: 500px;
      border: 5px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 250px;
      height: 350px;

      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
    }
    .bg-image {
      background-color: green;
      width: 100%;
      height: 90px;
      background-image: url(/week2/assets/bg.webp);
      background-position: center;
      background-size: cover;
    }

    .profile-image {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 35px;
      transform: translate(-50%);
      border: 3px solid white;
      background-image: url(../assets/frofile.webp);
      background-position: center;
      background-size: cover;
    }
    .content {
      margin-top: 60px;

      height: 150px;
      width: 100%;
      text-align: center;
    }
    .head-text {
      margin-top: 20px;
    }
    .icons {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }
    svg {
      width: 25px;
      margin-left: 10px;
    }
  </style>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="bg-image"></div>
        <div class="profile-image"></div>
        <div class="content">
          <div class="head-text">
            <h3>Aurora Chen</h3>
            <p style="color: gray">@auroracreates</p>
          </div>
          <span class="blog">
            <p style="font-size: small; padding: 10px; line-height: 19px">
              Digital artist & front-end developer based in Neo-Kyto. Passionate
              about creating beautiful, intutive interface, Fueled by coffee and
              a love for cyberpunk aesthetics.
            </p>
          </span>
