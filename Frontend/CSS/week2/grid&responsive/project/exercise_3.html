<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise-3</title>
  </head>
  <style>
    .parent {
      margin: auto;
      padding: 20px 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "child1 child2 child2"
        "child1 child3 child4"
        "child1 child5 child5";
    }
    .child {
      border: 1px solid black;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .c1 {
      grid-area: child1;
    }
    .c2 {
      grid-area: child2;
    }
    .c3 {
      grid-area: child3;
    }
    .c4 {
      grid-area: child4;
    }
    .c5 {
      grid-area: child5;
    }
    @media only screen and (max-width: 600px) {
      .parent {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "child1 child1"
          "child2 child2"
          "child3 child4"
          "child5 child5";
      }
    }
  </style>
  <body>
    <div class="parent">
      <div class="child c1">1</div>
      <div class="child c2">2</div>
      <div class="child c3">3</div>
      <div class="child c4">4</div>
      <div class="child c5">5</div>
    </div>
  </body>
</html>
